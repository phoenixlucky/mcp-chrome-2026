# Reasonix configuration.
# Resolution order: flag > ./reasonix.toml > ~/AppData/Roaming/reasonix/config.toml > built-in defaults.
# Fields marked user/global only are not overridden by ./reasonix.toml.
# Secrets are named via api_key_env and stored in Reasonix's global .env; never put keys here.

config_version = 4
default_model = "deepseek-flash"
# language      = "zh"   # ui/model language; empty = auto-detect from $LANG / $REASONIX_LANG

[agent]
cold_resume_prune = true
plan_mode_read_only_commands = ["pnpm run", "npm publish --access", "npm --prefix", "pnpm publish --access", "pnpm publish --filter", "pnpm --filter"]

[tools]
bash_timeout_seconds = 120
mcp_call_timeout_seconds = 300

[tools.background_jobs]
stalled_warning_seconds = 900


[tools.shell]
# prefer = "auto"   # auto|bash|powershell|pwsh; empty/default = auto-detect
# path   = "/opt/homebrew/bin/bash"   # absolute path to the shell executable; empty = PATH lookup

[lsp]
enabled = true   # language server tools; servers launch lazily when used
# [lsp.servers.go]
# command = "gopls"
# args = []
# extensions = [".go"]

[skills]
# paths = ["~/my-skills", "../shared/skills"]   # extra custom skill roots
# excluded_paths = ["~/.agents/skills"]   # hide convention roots without deleting folders
# max_depth = 3   # nested scan depth; set 1 for legacy root-only discovery
# disabled_skills = ["review"]   # hide noisy or unwanted skills

[permissions]
allow = ["Bash(git remote:*)", "Bash(git branch:*)", "explore", "Bash(git stash:*)", "Bash(Get-Content \"E:\\home\\mcp-chrome-2026\\package.json\" -Raw | Select-String -Pattern \"@modelcontextprotocol\" -Context 0,2)", "Bash(Get-Content \"E:\\home\\mcp-chrome-2026\\node_modules\\@modelcontextprotocol\\sdk\\package.json\" -Raw | Select-String -Pattern '\"version\"')", "Bash=cd packages/shared && cat package.json | python -c \"import sys,json; d=json.load(sys.stdin); print(json.dumps({k:d.get(k) for k in ['scripts','main','types']}, indent=2))\"", "Bash=npm whoami 2>$null; if (-not $?) { Write-Host \"NOT_LOGGED_IN\" }", "Bash=python -c \"\nimport re\n\nwith open('packages/shared/src/node-specs-builtin.ts', 'r', encoding='utf-8') as f:\n    content = f.read()\n\n# Find all registerNodeSpec calls and extract display info\nspecs = re.findall(r\"registerNodeSpec\\(\\{([^}]+(?:}[^}]+)*?)\\}\\);\", content, re.DOTALL)\n\nfor spec in specs:\n    type_match = re.search(r\"type:\\s*STEP_TYPES\\.(\\w+)\", spec)\n    label_match = re.search(r\"label:\\s*'([^']+)'\", spec)\n    category_match = re.search(r\"category:\\s*'(\\w+)'\", spec)\n    if type_match and label_match and category_match:\n        print(f'{category_match.group(1):10s}  {label_match.group(1):10s}  ({type_match.group(1)})')\n\"", "Bash=python _temp_parse_specs.py 2>$null; if ($?) { Remove-Item _temp_parse_specs.py }", "Bash=python -c \"\nimport struct\nfor f in ['screenshots/popup-ui.webp','screenshots/builder-ui.webp','screenshots/quick-panel.webp']:\n    with open(f,'rb') as fh:\n        h = fh.read(16)\n    ok = h[:4] == b'RIFF' and h[8:12] == b'WEBP'\n    print(f, '->', 'valid webp' if ok else 'INVALID', '| size', len(open(f,'rb').read()), 'bytes')\n\"", "Bash=python -c \"from PIL import Image; print('Pillow OK', Image.__version__ if hasattr(Image,'__version__') else '')\" 2>&1", "Bash=Write-Output '--- ffmpeg ---'; (Get-Command ffmpeg -ErrorAction SilentlyContinue).Source; Write-Output '--- magick ---'; (Get-Command magick -ErrorAction SilentlyContinue).Source; Write-Output '--- sharp in node_modules ---'; Get-ChildItem -Path . -Recurse -Filter 'sharp' -Directory -ErrorAction SilentlyContinue | Where-Object { $_.FullName -notmatch '\\.pnpm' } | Select-Object -First 3 -ExpandProperty FullName; Write-Output '--- node jimp ---'; Get-ChildItem -Path . -Recurse -Filter 'jimp' -Directory -ErrorAction SilentlyContinue | Where-Object { $_.FullName -notmatch '\\.pnpm' } | Select-Object -First 3 -ExpandProperty FullName", "Bash=node -e \"const fs=require('fs');const s=fs.readFileSync('packages/shared/src/tools.ts','utf8');const m=[...s.matchAll(/^\\s*name:\\s*'([^']+)'/gm)].map(x=>x[1]);console.log(m.join('\\n'));console.log('TOTAL:'+m.length)\"", "Bash=node -e \"\nconst fs=require('fs');\nconst s=fs.readFileSync('packages/shared/src/tools.ts','utf8');\n// extract TOOL_SCHEMAS array entries: { name: '...', description: '...' }\nconst block=s.slice(s.indexOf('export const TOOL_SCHEMAS'), s.indexOf('for (const tool of TOOL_SCHEMAS)'));\nconst re=/name:\\s*'([^']+)',\\s*description:\\s*'((?:[^'\\\\]|\\\\.)*)'/gs;\nlet m, tools=[];\nwhile((m=re.exec(block))!==null){tools.push({name:m[1],desc:m[2]});}\nconst vue=fs.readFileSync('app/chrome-extension/entrypoints/popup/components/McpToolsPage.vue','utf8');\nconst zhBlock=vue.slice(vue.indexOf('const zhDescriptions'), vue.indexOf('const zhToolParameterDescriptions'));\nconst zhRe=/(\\w+):\\s*'/g;\nconst zhKeys=new Set();\nlet z;\nwhile((z=zhRe.exec(zhBlock))!==null){zhKeys.add(z[1]);}\nconsole.log('TOOL_SCHEMAS count:', tools.length);\nconsole.log('zhDescriptions count:', zhKeys.size);\nconst missing=tools.filter(t=>!zhKeys.has(t.name));\nconsole.log('--- MISSING zh (name | desc) ---');\nfor(const t of missing) console.log(t.name+' | '+t.desc);\n\""]
[sandbox]
# Confine tool blast radius. File-writers (write_file/edit_file/multi_edit/move_file)
# may only write under workspace_root (empty = current dir) and allow_write extras.
# bash = "enforce" jails each command in an OS sandbox when available;
# without one, bash execution is refused. Empty defaults to enforce on macOS/Linux.
# Windows currently forces bash = "off" to restore pre-1.16 unconfined shell execution.
# network allows sandboxed bash egress.
# workspace_root = ""            # default: current working directory
# allow_write = ["/tmp"]          # extra dirs writers may also modify
# forbid_read = []                  # dirs the agent cannot read or list
bash    = "off"
network = true

[statusline]
# A custom status line: a command whose first stdout line replaces the built-in
# data row. It receives {"model","contextUsed","contextWindow","cwd"} as JSON on stdin.
# command = "my-statusline.sh"

# External MCP servers. type: "stdio" (default, a subprocess) | "http" | "sse".
# ${VAR} / ${VAR:-default} are expanded from the environment in command/args/env/url/headers.
# [[plugins]]
# name    = "example"
# command = "reasonix-plugin-example"
# call_timeout_seconds = 600       # optional per-server MCP call timeout
# tool_timeout_seconds = { "generate_video" = 1800 }   # raw MCP tool names
# trusted_read_only_tools = ["search"]   # optional pre-seeded MCP read-only trust
# [[plugins]]                                  # a remote server over Streamable HTTP
# name    = "stripe"
# type    = "http"
# url     = "https://mcp.stripe.com"
# headers = { Authorization = "Bearer ${STRIPE_KEY}" }
