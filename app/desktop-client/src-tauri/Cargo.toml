[package]
name = "chrome-mcp-desktop"
version = "2.6.7"
description = "Chrome MCP Bridge desktop client"
authors = ["Ethan Wilkins"]
edition = "2024"

[lib]
name = "chrome_mcp_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
