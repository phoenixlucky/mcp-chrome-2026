packages:
  - 'app/*'
  - 'packages/*'
allowBuilds:
  # better-sqlite3 v13+ ships N-API prebuilt binaries and has no install scripts;
  # source builds (binding.gyp) are unnecessary.
  better-sqlite3: false
  esbuild: true
  protobufjs: true
  sharp: true
  spawn-sync: true
  vue-demi: true
minimumReleaseAgeExclude:
  - '@ethanwilkins/chrome-mcp-shared-2026@1.4.0'
  - vite@8.3.0
  - '@ethanwilkins/typescript-native@7.0.3'
overrides:
  hono: ^4.13.7
  rollup-plugin-dts: ^6.5.1
