[package]
name = "simd-math"
version = "2.4.1"
edition = "2021"
description = "SIMD-optimized WebAssembly math functions for Chrome MCP"
license = "MIT"
repository = "https://github.com/phoenixlucky/mcp-chrome-2026"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
wide = "0.7"
console_error_panic_hook = "0.1"

[dependencies.web-sys]
version = "0.3"
features = [
  "console",
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
